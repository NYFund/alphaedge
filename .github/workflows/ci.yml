name: CI

on:
  push:
  pull_request:

# 同一分支連續推送時，取消還在跑的舊 workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      # 先裝鎖定版本的 requirements.txt（與本機、Docker 同一份），再補 dev extras。
      # 只裝 `.[dev]` 時 pip 依 pyproject 的下限（如 `shioaji>=1.3`）抓最新版，
      # CI 測到的就是本機沒在用的版本：shioaji 1.7 的 `OrderState` 已不是 Enum，
      # 同一條測試在 CI 紅、在本機綠，量到的是版本差而不是程式碼
      - name: 安裝專案與開發相依
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Lint（CLAUDE.md §2.5 import 排序、§2.10 行寬與引號）
        run: ruff check .

      - name: 格式檢查
        run: ruff format --check .

      # 分層相依閘門：反向 import、循環 import、市場語意洩漏、跨軸目錄污染
      # 這支腳本原本永遠 exit 1（strategy_lab 的循環 import 把整個閘門鎖住），
      # 2026-09-04 解掉之後才有資格當閘門。約 0.5 秒
      - name: 分層相依檢查
        run: python scripts/check_layer_deps.py

      # 文件路徑漂移閘門：`.md` 裡指不到、但同名檔存在於別處的路徑引用。
      # 這支在 2026-09-13 之前不在任何閘門裡，於是它在 HEAD 上紅了三天沒人發現
      # （健檢第四輪 S2）。純靜態掃描，不需要資料庫，約 0.3 秒
      - name: 文件路徑檢查
        run: python scripts/check_doc_paths.py

      # `core/api` 的死介面閘門：零呼叫零測試的公開方法。
      # 它會 import `core/api`，故排在測試相依裝好之後
      - name: API 死介面檢查
        run: python scripts/check_api_orphan_methods.py

      # SHORT 回歸線：純記憶體、不需要資料庫，約 0.7 秒
      # LONG 線需要 data/db/tw_stock.db，CI 沒有，故仍只能在本機跑
      # （`scripts/run_regression.sh` 現在會在 skip 時以結束碼 3 明說沒跑）
      - name: SHORT 回歸線
        run: pytest tests/backtest/test_short_regression.py -q -rs

      # 只跑 -m "not slow"：CI 沒有 data/db/tw_stock.db（*.db 未進版控），
      # 也沒有 Shioaji／FinMind 金鑰。需要這些的測試一律標 @pytest.mark.slow。
      # 本指令已在本機以「移除資料庫與金鑰的副本」模擬驗證過為全綠
      #
      # **`-rs` 不可拿掉**：沒有它，被 skip 的測試在輸出裡只是一個 `s`，
      # 整組因為 fixture 不存在而永遠跳過也看起來是綠的（前端回歸的 14 條
      # 就這樣從來沒在 CI 跑過）。加上它，跳過的原因會列在 short summary 裡
      - name: 測試（略過需要資料庫與外部 API 的項目）
        run: pytest -m "not slow" --timeout=300 -rs

      # 覆蓋率只建立基線、不設門檻：覆蓋率明顯偏低時設門檻只會鼓勵寫無效測試
      - name: 測試覆蓋率（僅報告，不阻擋）
        continue-on-error: true
        run: pytest -m "not slow" --cov=core --cov-report=term-missing
