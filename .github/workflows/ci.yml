name: CI

on:
  push:
  pull_request:

# 同一分支連續推送時，取消還在跑的舊 workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # uv 版本釘死：lock 檔格式與解析行為跟著 uv 版本走，與本機不同版時
      # 可能出現「本機 lock 有效、CI 判定過期」這類與程式碼無關的紅燈。
      # Python 版本由 `.python-version` 決定，不在這裡重複寫一份。
      # setup-uv 不發佈 `v10` 這種浮動主版本 tag，只能寫完整版號
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # `--locked`：`uv.lock` 與 `pyproject.toml` 對不上時直接失敗，而不是悄悄重新解析。
      # 少了它，改了 pyproject 卻忘了更新 lock 時，CI 會照新解析的版本裝，
      # 測到的就不是本機與 Docker 在跑的版本（shioaji 1.7 的 `OrderState`
      # 已不是 Enum，同一條測試曾因此在 CI 紅、在本機綠）
      #
      # `--extra frontend`：`tests/test_frontend_app_smoke.py` 要真的把 `frontend/app.py`
      # 跑一遍，沒有 streamlit 就只會被 skip——等於沒測
      - name: 安裝專案與開發相依
        run: uv sync --locked --extra dev --extra frontend

      - name: Lint（CLAUDE.md §2.5 import 排序、§2.10 行寬與引號）
        run: uv run ruff check .

      - name: 格式檢查
        run: uv run ruff format --check .

      # 分層相依閘門：反向 import、循環 import、市場語意洩漏、跨軸目錄污染
      # 這支腳本原本永遠 exit 1（strategy_lab 的循環 import 把整個閘門鎖住），
      # 2026-09-04 解掉之後才有資格當閘門。約 0.5 秒
      - name: 分層相依檢查
        run: uv run python scripts/check_layer_deps.py

      # 文件路徑漂移閘門：`.md` 裡指不到、但同名檔存在於別處的路徑引用。
      # 這支在 2026-09-13 之前不在任何閘門裡，於是它在 HEAD 上紅了三天沒人發現
      # （健檢第四輪 S2）。純靜態掃描，不需要資料庫，約 0.3 秒
      - name: 文件路徑檢查
        run: uv run python scripts/check_doc_paths.py

      # pre-commit 的其餘 hook：註解不得引用 backlog 步驟編號（CLAUDE.md §2.1）、
      # 禁用 exc_info=、YAML／TOML 語法、檔尾換行、行尾空白、大檔。
      # 它們原本只在裝了 hook 的本機生效，而本機多半沒裝——等於沒有閘門，
      # HEAD 上曾累積十幾處引用步驟編號的註解。ruff 與兩支腳本上面已經各跑一次，
      # 以 SKIP 略過，不重跑
      - name: pre-commit 其餘檢查
        env:
          SKIP: ruff,ruff-format,check-layer-deps,check-doc-paths
        run: uvx pre-commit run --all-files --show-diff-on-failure

      # `core/api` 的死介面閘門：零呼叫零測試的公開方法。
      # 它會 import `core/api`，故排在測試相依裝好之後
      - name: API 死介面檢查
        run: uv run python scripts/check_api_orphan_methods.py

      # SHORT 回歸線：純記憶體、不需要資料庫，約 0.7 秒
      # LONG 線需要 data/db/tw_stock.db，CI 沒有，故仍只能在本機跑
      # （`scripts/run_regression.sh` 現在會在 skip 時以結束碼 3 明說沒跑）
      - name: SHORT 回歸線
        run: uv run pytest tests/backtest/test_short_regression.py -q -rs

      # 只跑 -m "not slow"：CI 沒有 data/db/tw_stock.db（*.db 未進版控），
      # 也沒有 Shioaji／FinMind 金鑰。需要這些的測試一律標 @pytest.mark.slow。
      # 本指令已在本機以「移除資料庫與金鑰的副本」模擬驗證過為全綠
      #
      # **`-rs` 不可拿掉**：沒有它，被 skip 的測試在輸出裡只是一個 `s`，
      # 整組因為 fixture 不存在而永遠跳過也看起來是綠的（前端回歸的 14 條
      # 就這樣從來沒在 CI 跑過）。加上它，跳過的原因會列在 short summary 裡
      - name: 測試（略過需要資料庫與外部 API 的項目）
        run: uv run pytest -m "not slow" --timeout=300 -rs

      # 覆蓋率只建立基線、不設門檻：覆蓋率明顯偏低時設門檻只會鼓勵寫無效測試
      - name: 測試覆蓋率（僅報告，不阻擋）
        continue-on-error: true
        run: uv run pytest -m "not slow" --cov=core --cov-report=term-missing

  # 兩個 Docker 映像：以前 CI 從不 build，映像壞掉要等有人手動 build 才發現
  # （`frontend/Dockerfile` 開頭的註解記錄的就是一次這樣的迴歸）。
  # 與 `check` 平行跑，不必等測試
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 建置 core 映像
        run: docker build -f core/Dockerfile -t alphaedge-core .

      # 進入點是 `python run.py`，預設參數 `--help`：跑得起來代表相依裝齊、
      # editable 安裝與 `core/config/paths.py` 的路徑推導都正常
      - name: core 映像冒煙
        run: docker run --rm alphaedge-core

      - name: 建置 frontend 映像
        run: docker build -f frontend/Dockerfile -t alphaedge-frontend .

      # **工作目錄刻意切到 `/`**：`python -c` 會把工作目錄放進 `sys.path`，
      # 在 `/app` 底下跑的話，拿掉 `PYTHONPATH=/app` 也照樣 import 得到，
      # 就驗不到 Streamlit 實際執行時的那個條件。三個套件是 `app.py` 的相依，
      # 缺一個就是「映像裝得起來、一開頁就 ModuleNotFoundError」
      - name: frontend 映像冒煙
        run: >-
          docker run --rm -w / alphaedge-frontend
          python -c "import frontend.config, streamlit, plotly, pandas"
