services:
  core:
    build:
      context: .
      dockerfile: core/Dockerfile
    container_name: alphaedge-core
    # **不要在這裡設 MODE／STRATEGY**：下方 `command` 的 `${MODE:-backtest}` 是
    # compose **解析設定檔時**由 shell 環境或 `.env` 替換的，與容器的
    # `environment` 無關。寫在 environment 裡不會改變啟動參數，只會讓人以為改了。
    # 要換策略：`MODE=backtest STRATEGY=XXX docker compose up core`，或寫進 `.env`
    command:
      [
        "--mode",
        "${MODE:-backtest}",
        "--strategy",
        "${STRATEGY:-MomentumStrategy1}",
      ]
    volumes:
      - alphaedge_results:/app/results
      # 回測要讀 `data/db/tw_stock.db`。映像裡沒有資料庫，不掛就會在
      # `sqlite3.connect` 當場失敗——compose 承諾的「Trader＋Frontend」
      # 一次都跑不起來。**唯讀掛載**：容器只跑回測，
      # 不該寫到本機的資料庫（背景 ETL 可能正在寫同一個檔）
      - ./data:/app/data:ro
      - ./logs:/app/logs

  # 實盤：**不常駐**，由主機排程逐段落啟動（見 docs/deployment/live-deployment.md）：
  #   docker compose --profile live run --rm live --strategy MomentumStrategy1 --phase open
  # `profiles` 讓 `docker compose up` 不會順手把它帶起來——實盤只能被明確啟動。
  # 正式環境要另外帶 `--production --confirm-production`，刻意不寫進這裡
  live:
    profiles: ["live"]
    build:
      context: .
      dockerfile: core/Dockerfile
    # 模式寫死在 entrypoint：`run` 後面接的參數會整個取代 `command`，
    # 放在 command 的話漏寫 `--mode live` 就變成跑回測
    entrypoint: ["python", "run.py", "--mode", "live"]
    # 金鑰（API_KEY、SHIOAJI_CA_PASSWORD、通知 token）只從 `.env` 讀，不進映像
    env_file: .env
    environment:
      # 與 core/Dockerfile 相同；排程與容器兩邊都要是台北時間
      TZ: Asia/Taipei
      # 覆寫 `.env` 裡的主機路徑：憑證在容器內一律掛在 /ca
      SHIOAJI_CA_PATH: /ca/${SHIOAJI_CA_FILE:-Sinopac.pfx}
    # 收到停止訊號後要先撤未成交單、等券商回覆、寫結束紀錄；
    # 預設 10 秒到了就 SIGKILL，撤單會被打斷在一半
    stop_grace_period: 90s
    volumes:
      # **可寫**：實盤要寫 `data/db/tw_trading.db`（委託、成交、歸屬帳），
      # 研究庫則是唯讀開啟（`connect_sqlite(read_only=True)`），不會被寫到
      - ./data:/app/data
      - ./logs:/app/logs
      - alphaedge_results:/app/results
      # CA 憑證唯讀掛入，放在專案目錄以外（不進 git、不進映像）
      - ${ALPHAEDGE_CA_DIR:-${HOME}/.alphaedge/ca}:/ca:ro

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: alphaedge-frontend
    ports:
      - "8501:8501"
    environment:
      # 與後端 `core/config/paths.py` 同名；後端寫哪、前端就讀哪
      ALPHAEDGE_RESULTS_DIR: /results
    volumes:
      - alphaedge_results:/results
    # **刻意沒有 `depends_on: [core]`**：`core` 是跑完就結束的一次性批次容器，
    # 而本服務是常駐 Web，只讀 volume 裡 reporter 落地的 CSV，兩者沒有執行期相依。
    # 加了的實際效果是 `docker compose up frontend` 順手跑一整場回測。
    # 先跑 `docker compose up core` 產生結果，再開前端
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  alphaedge_results:
