[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphaedge"
version = "0.1.0"
description = "台股量化研究平台：資料 ETL、回測引擎與策略開發"
requires-python = ">=3.12"

# 只列「程式碼實際 import 的套件」，傳遞相依交給 uv 解析。
# 清單由 AST 掃描 core/、tasks/、frontend/、tests/、strategy_lab/ 的 import 產出，
# 版本下限取當前實測可用的版本；鎖定的精確版本見 uv.lock（改了這裡要重新 `uv lock`）。
dependencies = [
    "FinMind>=1.9",
    # FinMind 1.9.8 **自己 import 了 tqdm 卻沒有宣告它**（`Requires:` 內沒有），
    # 故必須由本專案代為列出——uv 只照宣告解析，少了它 lock 裡就沒有 tqdm，
    # 整個 `tests/` 會在 collect 階段就 ImportError（2026-09-01 CI 全紅的成因）。
    # 本專案自己的程式碼沒有 import tqdm，這是**代宣告的傳遞相依**，不是漏列。
    "tqdm>=4.67",
    # 以下兩個是**執行期才用得到、import 掃描抓不到**的相依，漏列時要等那條路徑跑起來才炸：
    # - kaleido：plotly 的 `write_image()` 靠它輸出 PNG，每份回測報表的圖都會走到
    #   （`core/backtest/report/reporter.py` 的 `save_figure()`）
    # - html5lib：`pd.read_html` 在 lxml 解不動某些 MOPS 頁面時會退到 bs4 flavor，
    #   缺它就 ImportError（2026-09-04 權益變動表回補實際炸過，當時只補進本機 venv）
    "kaleido>=1.2",
    "html5lib>=1.1",
    "fake-useragent>=2.2",
    "loguru>=0.7",
    "numpy>=2.4",
    "pandas>=3.0",
    "plotly>=6.7",
    "python-dateutil>=2.9",
    "python-dotenv>=1.2",
    "requests>=2.33",
    # 1.7 起核心改為原生模組：Enum 不再是 Python Enum、`login()` 不收
    # `contracts_timeout`、`stream_data_type` 只剩相容層。`core/broker/tw/` 依 1.7 寫成，
    # 裝到 1.5 以下會在登入與行情重放時失敗，下限不可放寬
    "shioaji>=1.7",
    "yfinance>=1.3",
]

# 開發工具放 dependency group 而不是 extra：`uv sync` 預設就會裝 `dev` 這一組，
# 加裝其他 extra（`uv sync --extra frontend`）時也不會被移除——extra 的話，沒列在
# 指令上的會被 `uv sync` 拿掉，漏寫 `--extra dev` 就少了 pytest 與 ruff。
# 正式映像以 `--no-dev` 排除（見 `core/Dockerfile`）；dev 工具也不會出現在套件 metadata
[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-timeout>=2.4",
    "pytest-cov>=5.0",
    # **版本必須與 .pre-commit-config.yaml 的 ruff-pre-commit rev 一致**：
    # 格式規則跨版本會變，本機用 0.16.3、CI 裝最新版時會出現「本機綠、CI 紅」，
    # 而那種紅燈與程式碼品質無關，只會訓練大家忽略 CI
    "ruff==0.16.3",
]

[project.optional-dependencies]
# 以下三組刻意不放進主 dependencies：專案的回測與 ETL 主流程不需要它們，
# 硬列進去只會讓每個環境（含 Docker 映像）都變重。需要時以 `uv sync --extra <名稱>` 加裝
frontend = ["streamlit>=1.49"]  # frontend/ 的 Streamlit 介面（1.49 起才有 width="stretch"）
tick = ["dolphindb>=3.0"]  # Tick 級資料的 DolphinDB 儲存（loader 內為惰性 import）
lab = ["python-docx>=1.2"]  # strategy_lab/ 的報告輸出

[tool.setuptools.packages.find]
# `core.managers` 等目錄沒有 __init__.py，靠 PEP 420 namespace package 運作，
# 故 namespaces 必須為 true，否則 editable 安裝後 `core.managers.*` 會 import 不到
namespaces = true
include = ["core*", "tasks*", "tests*"]
exclude = [
    # 測試 fixture 目錄：會被 namespace 掃描當成套件，實際上不含任何 .py。
    # `core.*` 的產物排除項已於執行期產物重整後全數刪除——那些目錄不在 core/ 底下了
    "tests.database*",
    "tests.downloads*",
    "tests.temp*",
]

[tool.ruff]
line-length = 88  # CLAUDE.md §2.10
target-version = "py312"
extend-exclude = [
    "kuo_test.ipynb",
    # ruff 0.16 起會連 Markdown 內的 Python 程式碼區塊一起格式化。
    # 文件裡的範例常刻意對齊註解以利閱讀，被重排只會製造與本工作無關的 diff；
    # `CLAUDE.md` §2.5／§2.10 規範的對象是程式碼，不是文件
    "*.md",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "TRY", "ANN201", "ANN204"]
# ANN201／ANN204 是 CLAUDE.md §2.4「所有函式回傳值都要標註，含 `-> None`」的閘門。
# 2026-09-13 補齊 181 處後才開啟（健檢第四輪 S4）；在那之前這條規範完全沒有機器護欄。
# 只開這兩條、不開整組 ANN：ANN001（參數）另有 400 多處，且 `**kwargs`／`self`
# 那幾條（ANN002／ANN003／ANN101）與本專案既有寫法衝突

# ignore 清單的每一條都必須註明對應的 CLAUDE.md 章節或延後理由，
# 不要在沒有理由的情況下「順手」打開或關閉
ignore = [
    # --- 與 CLAUDE.md §2.4 型別註解規範直接衝突：專案明訂用 typing 的大寫寫法 ---
    "UP006",  # §2.4.3 List/Dict，不改 list[...]/dict[...]
    "UP035",  # 同上，不移除 typing import
    "UP007",  # §2.4.3 Union[X, Y]，不改 X | Y
    "UP045",  # §2.4.4 Optional[T]，不改 T | None（391 處，數量最大的一條）

    # --- 與 CLAUDE.md §2.7 常數與 Enum 規範衝突 ---
    "UP042",  # §2.7 明訂 class XxxEnum(str, Enum)，不改 StrEnum

    # --- 行寬交給 formatter ---
    # formatter 已強制 line-length 88，但無法拆分註解、docstring 與長字串，
    # 而本專案的中文註解與結構化 docstring 必然有超長行（597 處）。
    # 留著只會讓 CI 永遠紅燈，且逼人把中文註解硬折行，可讀性反而更差
    "E501",

    # --- 例外處理：只量化不修，數量記在各條的行尾註解 ---
    # 數量過大會讓 CI 永遠紅燈，故先 ignore 並逐條記錄；
    # 不可因為「讓 CI 變綠」就當成永久豁免
    "BLE001",  # blind-except，70 處
    "TRY003",  # 例外訊息長度，與 §2.1 中文訊息衝突
    "TRY300",  # try-consider-else，20 處
    "TRY301",  # raise-within-try，3 處
    "TRY201",  # verbose-raise，3 處
    "TRY004",  # type-check-without-type-error，4 處

    # --- 設計選擇，非缺陷 ---
    # 基底類別刻意留的 no-op 掛點（例如股票的 settle_daily：股票沒有每日結算），
    # 標成 @abstractmethod 反而會強迫每個子類別寫一個空實作
    "B027",
    # zip(..., strict=) 屬行為決策：現有呼叫點多半長度本就相同，
    # 補 strict=True 可能讓原本靜默的長度不一致改為拋錯，須逐點確認後再開
    "B905",

    # --- 潛在缺陷，已逐點記錄，待後續收斂 ---
    # 這 10 處**不是樣式問題，是真的可能出錯的地方**，逐處位置用
    # `ruff check --select <規則>` 查。之所以先 ignore 而非在原地加 noqa：
    # 加了 noqa 會讓該行超過 88 字元，formatter 就把運算式拆成多行，
    # noqa 反而跟著跑到別行去、失去效力（實測過）。
    # **修掉之後要把對應那條從本清單移除**，不要讓它長期留著——留著等於對那類
    # 問題永久失明。2026-09-18 實查後移除已歸零的 B008／F841／F811，
    # 並修掉 B007 最後一處（`tests/test_futures_continuous.py` 的未用迴圈變數）。
    "B006",  # 可變預設參數，4 處
    "B904",  # raise 未帶 from，3 處
    "E722",  # 裸 except，3 處
]

[tool.ruff.lint.per-file-ignores]
# 套件的 re-export 門面：__init__.py 的 import 就是對外介面，不是未使用
"__init__.py" = ["F401"]

# 獨立執行的手動腳本：`.env` 必須在部分 import **之前**載入（那些模組在 import
# 期就讀環境變數），所以 import 之間夾著程式碼是刻意的，E402 屬預期行為。
# `tests/*` 與 `strategy_lab/*` 原本也在這裡，是為了遷就 `sys.path.insert`
# 卡在 import 中間。那 18 處已於 2026-09-10 清除，殘留的
# `_PROJECT_ROOT` 賦值一併移到 import 之後，兩條豁免因此不再需要——
# 移除後 `ruff check .` 對 `tests/` 與 `strategy_lab/` 全綠
"scripts/manual/*" = ["E402", "ANN201"]

# 測試內的 helper／fixture／替身方法（24 處）：它們的回傳型別多半是「某個
# 被 monkeypatch 過的 loader」或 `(物件, 路徑)` 的 tuple，標註要嘛得把類別
# 從函式內部的 import 搬到檔頭（那會讓 monkeypatch 失效），要嘛只能寫成
# `Any`——兩者都比不標更糟。**`ANN204` 仍然生效**，`__init__` 一律要 `-> None`；
# 生產程式碼（`core/`、`tasks/`、`frontend/`、`run.py`）兩條都生效
"tests/*" = ["ANN201"]

# dolphindb 是選用相依（見 [project.optional-dependencies] 的 tick），
# 這幾處的 import 是「可用性探測」，不是沒用到的 import
"core/pipeline/tw/utils/stock_tick_utils.py" = ["F401"]
"core/pipeline/tw/loaders/stock_tick_loader.py" = ["F401"]
"scripts/manual/manual_tick_updater.py" = ["F401"]


[tool.ruff.format]
quote-style = "double"  # CLAUDE.md §2.10

[tool.pytest.ini_options]
# 由 pytest.ini 併入（該檔已刪除）
markers = [
    "slow: 需要資料庫或耗時較久的測試（例如 LONG 回歸比對）",
]

[tool.coverage.run]
source = ["core"]
omit = [
    "*/__pycache__/*",
]

[tool.coverage.report]
# 只建立基線，**不設 fail_under**：覆蓋率明顯偏低時設門檻只會鼓勵寫無效測試
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
